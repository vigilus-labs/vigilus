[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigilus"
version = "0.3.2"
description = "Vigilus – AI-powered infrastructure management platform"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.53",
    "sqlalchemy[asyncio]>=2.0.53",
    "alembic>=1.20",
    "aiosqlite>=0.22",
    "asyncpg>=0.31",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "httpx>=0.28",
    "paramiko>=5.0",
    "docker>=7.2",
    "cryptography>=50.0",
    "anthropic>=1.5",
    "openai>=3.14",
    "google-genai>=2.23",
    "pyjwt>=2.14",
    "structlog>=26.1",
    "mcp>=2.2",
    "apscheduler>=3.11,<4",
    "argon2-cffi>=25.1",
    "defusedxml>=0.7.1",
]

[project.optional-dependencies]
tui = [
    "textual>=8.2",
]
channels = [
    "discord.py>=2.7",
]
dev = [
    "ruff>=0.16",
    "black>=26.5",
    "pytest>=9.1",
    "pytest-asyncio>=1.4",
]

[project.scripts]
vigilus = "vigilus.cli:main"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    # E501: line length is handled by black; remaining hits are long strings/comments
    "E501",
    # UP042: converting str-Enums to StrEnum changes str() behavior; needs a careful pass
    "UP042",
    # N818: renaming existing exception classes is an API change; revisit deliberately
    "N818",
]

[tool.ruff.lint.per-file-ignores]
# Alembic migration filenames are timestamped and hyphenated by template
"vigilus/db/migrations/versions/*" = ["N999"]

[tool.black]
target-version = ["py311"]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
